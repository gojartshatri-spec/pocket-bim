<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#272b30" media="(prefers-color-scheme: dark)">
<meta name="description" content="A lite ArchiCAD for phones: draw floor plans with walls, doors, windows, slabs, roofs, stairs and zones, and see them in 3D.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket BIM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{box-sizing:border-box;color-scheme:light;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Pocket BIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: ArchiCAD-style workspace for a phone. Title bar, view tabs, Info Box, then Toolbox rail + drawing stage, Quick Options bar at the bottom; Navigator drawer and AI panel slide over. */
:root{
  --paper:#ffffff; --chrome:#eef0f3; --chrome2:#e1e5ea; --line:#c7cdd5; --ink:#1d2127; --muted:#667080;
  --accent:#1769d1; --accent-ink:#ffffff; --accent-soft:rgba(23,105,209,.12);
  --hatch:#4b5361; --trace:#b7c3d3; --thin:#8d97a5; --glass:#3d8fd1; --danger:#c62828;
  --grid:rgba(29,33,39,.045); --grid2:rgba(29,33,39,.10); --shade:0 10px 30px rgba(20,30,45,.18);
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1b1e22; --chrome:#272b30; --chrome2:#202327; --line:#3a4048; --ink:#e3e6ea; --muted:#98a1ad;
  --accent:#5aa2ff; --accent-ink:#08182e; --accent-soft:rgba(90,162,255,.16);
  --hatch:#a9b2be; --trace:#46505d; --thin:#6f7987; --glass:#6fb2e8; --danger:#ff8a80;
  --grid:rgba(227,230,234,.035); --grid2:rgba(227,230,234,.08); --shade:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b1e22; --chrome:#272b30; --chrome2:#202327; --line:#3a4048; --ink:#e3e6ea; --muted:#98a1ad;
  --accent:#5aa2ff; --accent-ink:#08182e; --accent-soft:rgba(90,162,255,.16);
  --hatch:#a9b2be; --trace:#46505d; --thin:#6f7987; --glass:#6fb2e8; --danger:#ff8a80;
  --grid:rgba(227,230,234,.035); --grid2:rgba(227,230,234,.08); --shade:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-sans);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block}
.app{height:100%;display:flex;flex-direction:column;position:relative}

/* title bar + tabs */
.titlebar{display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--chrome)}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:7px;flex:none;color:var(--ink)}
.ib:active{background:var(--accent-soft)}
.ib:disabled{opacity:.3}
.ib svg{width:21px;height:21px}
.proj{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:2px}
.proj b{font:600 15px var(--f-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj span{font:11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;padding:0 6px;background:var(--chrome2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:6px;padding:7px 11px;margin-top:3px;border-radius:6px 6px 0 0;font:500 12.5px var(--f-cond);color:var(--muted);white-space:nowrap;border:1px solid transparent;border-bottom:0}
.tab svg{width:15px;height:15px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink);border-color:var(--line);margin-bottom:-1px}

/* info box */
.infobox{display:flex;align-items:center;gap:12px;padding:6px 10px;min-height:56px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.infobox::-webkit-scrollbar,.tabs::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}
.ibk{display:flex;align-items:center;gap:8px;flex:none}
.ibk svg{width:26px;height:26px;color:var(--accent)}
.ibk b{display:block;font:600 14px var(--f-cond)}
.ibk small{display:block;font:10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ibsep{width:1px;align-self:stretch;background:var(--line);flex:none}
.ibhint{font-size:12.5px;color:var(--muted);white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:2px;flex:none;min-width:0}
.fld>span{font:500 10px var(--f-cond);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.fin{display:flex;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:0 6px;height:30px}
.fin input{width:62px;border:0;background:none;font:16px var(--f-mono);color:var(--ink);padding:0;outline:none;user-select:text;-webkit-user-select:text;min-width:0}
.fin input[readonly]{color:var(--muted)}
.fin.txt input{width:130px;font-family:var(--f-sans);font-size:16px}
.fin i{font:normal 11px var(--f-mono);color:var(--muted);margin-left:3px}
.fin select{border:0;background:none;font:14px var(--f-sans);color:var(--ink);height:28px;outline:none;max-width:150px}
.segm{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;height:30px;background:var(--paper)}
.segm button{padding:0 9px;font:500 12.5px var(--f-cond);color:var(--muted);white-space:nowrap}
.segm button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gear{display:flex;align-items:center;gap:5px;padding:0 10px;height:30px;border:1px solid var(--line);border-radius:5px;font:500 12.5px var(--f-cond);background:var(--paper);flex:none;align-self:flex-end}
.gear svg{width:15px;height:15px}

/* body: toolbox + stage */
.main{flex:1;min-height:0;display:flex}
.work{flex:1;min-width:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;display:flex}
.toolbox{width:60px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:1px;overflow-y:auto;background:var(--chrome);border-right:1px solid var(--line);padding:4px 4px 8px;scrollbar-width:none}
.toolbox h6{margin:6px 0 2px;font:600 8.5px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;border-radius:7px;font:500 10px var(--f-cond);color:var(--ink);letter-spacing:.02em}
.tool svg{width:23px;height:23px}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
@media (orientation:landscape) and (min-width:700px){.stage{flex-direction:row}}
.pane{flex:1;min-height:0;min-width:0;position:relative;overflow:hidden;background:var(--paper)}
.pane + .pane{border-top:1px solid var(--line)}
@media (orientation:landscape) and (min-width:700px){.pane + .pane{border-top:0;border-left:1px solid var(--line)}}
canvas{display:block;width:100%;height:100%;touch-action:none}
.fab{position:absolute;right:10px;width:40px;height:40px;display:grid;place-items:center;border-radius:9px;background:var(--chrome);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3}
.fab svg{width:20px;height:20px}
.ask{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-sans);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.ask svg{width:17px;height:17px}
.chip3d{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;pointer-events:none}.chip3d>*{pointer-events:auto}
.arov{position:fixed;inset:0;z-index:50;pointer-events:none}.arbar{position:absolute;left:12px;right:12px;bottom:24px;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(20,22,26,.78);color:#fff;font:13px var(--f-sans);pointer-events:auto}.arbar span{flex:1}.arbar button{padding:8px 12px;border-radius:8px;background:#fff;color:#111;font:600 13px var(--f-sans)}
.chip3d span,.chip3d button{font:500 11.5px var(--f-cond);padding:5px 9px;border-radius:6px;background:var(--chrome);border:1px solid var(--line);color:var(--muted)}
.chip3d button{color:var(--ink)}

/* tracker, pet palette, chain bar */
.tracker{position:absolute;z-index:6;pointer-events:none;background:var(--chrome);border:1px solid var(--line);border-radius:6px;padding:4px 7px;font:12px var(--f-mono);display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:1px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-variant-numeric:tabular-nums}
.tracker i{font-style:normal;color:var(--muted)}
.tracker b{font-weight:500;text-align:right}
.pet{position:absolute;z-index:5;display:flex;gap:2px;padding:3px;background:var(--chrome);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shade)}
.pet button{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:44px;padding:4px 4px 3px;border-radius:6px;font:500 9.5px var(--f-cond);color:var(--ink)}
.pet button:active{background:var(--accent-soft)}
.pet button.del{color:var(--danger)}
.pet svg{width:19px;height:19px}
.chainbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shade);font:12px var(--f-mono);white-space:nowrap}
.chainbar button{padding:7px 12px;border-radius:7px;font:600 13px var(--f-sans)}
.mgrid{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}.mgrid .btn{padding:6px 10px;font-size:12.5px;white-space:nowrap}
.wtc{border:1px solid var(--line);border-radius:8px;padding:8px;margin:0 0 10px}.wth{display:flex;gap:8px;align-items:center;margin-bottom:6px}.wth input{flex:1;min-width:0;font:600 13px var(--f-sans);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}.wth b{font:500 11.5px var(--f-mono);white-space:nowrap}
.wtl{display:grid;grid-template-columns:1fr 96px 32px;gap:6px;margin:4px 0;align-items:center}.wtl select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font:13px var(--f-sans)}.wtl .fin{display:flex}.wtf{display:flex;gap:8px;align-items:center;margin-top:6px}.wtf small{flex:1;color:var(--muted)}
.qto{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}.qto table{width:100%;border-collapse:collapse;font:12.5px var(--f-sans)}.qto th{position:sticky;top:0;background:var(--chrome);text-align:left;font:600 11px var(--f-cond);text-transform:uppercase;color:var(--muted);padding:6px 8px}.qto td{padding:4px 8px;border-top:1px solid var(--line)}.qto .n{text-align:right;font-family:var(--f-mono);white-space:nowrap}.qto .qg td{font:600 11.5px var(--f-cond);text-transform:uppercase;color:var(--accent);background:var(--accent-soft)}.qto input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink);font:12px var(--f-mono);text-align:right}.qto tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.chainbar .ok{background:var(--accent);color:var(--accent-ink)}

/* quick options */
.quick{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--chrome);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.qgroup{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none;background:var(--paper)}
.qgroup button{height:30px;padding:0 8px;font:500 12.5px var(--f-cond);white-space:nowrap}
.qgroup button + button{border-left:1px solid var(--line)}
.qgroup button svg{width:14px;height:14px}
.qchip{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;font:500 12px var(--f-mono);background:var(--paper);white-space:nowrap;flex:none;display:flex;align-items:center}
.qtog{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font:500 12.5px var(--f-cond);color:var(--muted);white-space:nowrap;flex:none;background:var(--paper)}
.qtog[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

/* navigator drawer */
.navbg{position:absolute;inset:0;background:rgba(10,15,20,.35);z-index:30}
.nav{position:absolute;left:0;top:0;bottom:0;width:min(330px,88vw);background:var(--chrome);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shade);border-right:1px solid var(--line)}
.navh{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-bottom:1px solid var(--line)}
.navh b{flex:1;font:600 16px var(--f-sans)}
.navc{flex:1;overflow-y:auto;padding:4px 0 16px}
.nav h4{margin:14px 16px 6px;font:600 11px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nrow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;text-align:left;font-size:14px}
.nrow:active{background:var(--accent-soft)}
.nrow.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nrow .idx{font:12px var(--f-mono);color:var(--muted);width:20px}
.nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .el{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nrow svg{width:17px;height:17px;color:var(--muted)}
.nform{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px}
.nform .fld:first-child{grid-column:1/-1}
.nform .fin input{width:100%}
.nacts{display:flex;gap:8px;padding:4px 16px;flex-wrap:wrap}
.btn{padding:8px 12px;border-radius:7px;border:1px solid var(--line);font:600 13px var(--f-sans);background:var(--paper)}
.btn:active{background:var(--accent-soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:currentColor}
.ztab{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ztab td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ztab td:first-child{font:12px var(--f-mono);color:var(--muted);width:38px}
.ztab td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.ztab tr.sub td{font-weight:600;color:var(--ink);border-bottom:2px solid var(--line)}
.ztab tr.zr{cursor:pointer}
.ztab .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* menu, dialog, toast */
.menu{position:absolute;right:6px;top:48px;z-index:40;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shade);padding:5px;display:flex;flex-direction:column;min-width:220px}
.menu button{text-align:left;padding:10px 12px;border-radius:7px;font-size:14px}
.menu button:active{background:var(--accent-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dlgbg{position:absolute;inset:0;background:rgba(10,15,20,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.dlgbg{align-items:center}}
.dlg{background:var(--chrome);width:min(520px,100%);max-height:85%;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:var(--shade);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.dlg{border-radius:12px}}
.dlgh{display:flex;align-items:center;gap:10px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--line)}
.dlgh svg{width:24px;height:24px;color:var(--accent)}
.dlgh b{flex:1;font:600 16px var(--f-sans)}
.dlgc{overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.dlgc h5{margin:4px 0 0;font:600 11px var(--f-cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dgrid .fin input{width:100%}
.dgrid .fin select{max-width:none;width:100%}
.dlgc textarea{width:100%;min-height:140px;font:13px var(--f-mono);border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:8px;user-select:text;-webkit-user-select:text}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13.5px;z-index:60;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* AI panel */
.chat{display:flex;flex-direction:column;background:var(--chrome);min-height:0}
@media (min-width:900px){.chat{width:min(380px,34vw);border-left:1px solid var(--line)}}
@media (max-width:899px){.chat{position:fixed;left:0;right:0;bottom:0;height:min(62%,560px);z-index:20;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}}
.chat-head{display:flex;align-items:center;gap:6px;padding:8px 6px 8px 16px;border-bottom:1px solid var(--line)}
.chat-head div{flex:1;display:flex;flex-direction:column;line-height:1.15}
.chat-head b{font-size:15px}
.chat-head small{font:10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;user-select:text;-webkit-user-select:text;overscroll-behavior:contain}
.msg{max-width:88%;padding:8px 11px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai.wait{color:var(--muted);font-style:italic}
.note{font:11px var(--f-mono);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;white-space:normal}
.note button{color:var(--accent);font:600 13px var(--f-sans)}
.intro{font-size:13.5px;color:var(--muted);line-height:1.45;margin:0}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;text-align:left;background:var(--paper)}
.sug:active{background:var(--accent-soft)}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:none;font:16px/1.35 var(--f-sans);padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);max-height:120px;user-select:text;-webkit-user-select:text}
.send{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.4}
.segm button:disabled{opacity:.35}
.dlgc .segm{align-self:flex-start;flex-wrap:wrap;height:auto}

  // clashes: columns in doorways, beams below opening heads, objects through walls
  for (const o of model.openings) { const w = wallById(o.wid); if (!w) continue; const g = wgeo(w), c = { x: w.x1 + g.ux * o.pos, y: w.y1 + g.uy * o.pos };
    for (const cl of model.columns) if (cl.st === w.st && Math.abs((cl.x - w.x1) * g.ux + (cl.y - w.y1) * g.uy - o.pos) < o.w / 2 + Math.max(cl.w, cl.d) / 2 - .01 && Math.abs((cl.x - w.x1) * g.nx + (cl.y - w.y1) * g.ny) < w.t / 2 + Math.max(cl.w, cl.d) / 2) out.push({ kind: 'column', id: cl.id, st: cl.st, msg: `Clash: column in the ${o.type} opening` });
    for (const b of model.beams) if (b.st === w.st && b.top - b.h < o.sill + o.h - .01 && segDistPts(c, [b.x1, b.y1], [b.x2, b.y2]).d < b.w / 2 + w.t / 2) out.push({ kind: 'beam', id: b.id, st: b.st, msg: `Clash: beam soffit ${fmt(b.top - b.h)} m is below the ${o.type} head ${fmt(o.sill + o.h)} m` }); }
  for (const f of model.furniture) { if (FURN[f.type] && FURN[f.type].h === 0 || f.type === 'tree' || f.type === 'car') continue; const cs = furnCorners(f); const hit = model.walls.find(w => { if (w.st !== f.st) return false; const g = wgeo(w), L = wlen(w), al = cs.map(([x, y]) => (x - w.x1) * g.ux + (y - w.y1) * g.uy), sd = cs.map(([x, y]) => (x - w.x1) * g.nx + (y - w.y1) * g.ny); if (Math.max(...al) < .05 || Math.min(...al) > L - .05) return false; return segDist({ x: f.x, y: f.y }, w).d < w.t / 2 || Math.max(...sd) > w.t / 2 + .05 && Math.min(...sd) < -w.t / 2 - .05; }); if (hit) out.push({ kind: 'furn', id: f.id, st: f.st, msg: `Clash: ${FURN[f.type] ? FURN[f.type].label : 'object'} runs into a wall` }); }
  // fire: rough travel distance from each room to an exit (external door, or a stair above the ground floor)
  { const gnd = stories()[0]; for (const z of model.zones) { const st = storyOf(z.st); if (!st) continue; const c = centerOf(z), ex = []; for (const o of model.openings) { const w = wallById(o.wid); if (o.type === 'door' && w && w.st === z.st && isExtWall(w)) { const g = wgeo(w); ex.push([w.x1 + g.ux * o.pos, w.y1 + g.uy * o.pos]); } } if (gnd && st.id !== gnd.id) for (const s of model.stairs) if (s.st === z.st || storyAbove(s.st) && storyAbove(s.st).id === z.st) ex.push([s.x + s.w / 2, s.y + s.h / 2]); if (!ex.length) continue; const d = Math.min(...ex.map(([x, y]) => Math.abs(x - c[0]) + Math.abs(y - c[1]))); if (d > CODE().travel) out.push({ kind: 'zone', id: z.id, st: z.st, msg: `Fire: about ${Math.round(d)} m from ${z.name} to the nearest exit, over ${CODE().travel} m` }); } }
  for (const q of model.pipes || []) if (q.sys === 'drain' && (q.fall || 0) < 1) out.push({ kind: 'pipe', id: q.id, st: q.st, msg: `Drainage: fall ${fmt(q.fall || 0, 1)}%, under 1% (1:100)` });

/* ================= AI design assistant ================= */
const RULES = `You are the design assistant inside Pocket BIM, a lite ArchiCAD for phones. You read the user's request and the current building model, then change the model by returning actions. Reply in the user's language.

Units are metres. Plan coordinates: x grows to the right (east), y grows downward on screen (south, usually the street side). Every element belongs to a story (floor level). Stories have an elevation and a height (usually 3.0). Elements:
- walls: centre-line from (x1,y1) to (x2,y2), thickness t, height h, material mat (brick, block, concrete, gypsum). Exterior walls 0.3 brick, interior 0.12-0.15 block or gypsum, height 2.8 when the story is 3.0 high. Walls that meet share exact endpoints; an interior wall ends on the centre-line of the wall it meets.
- openings (door/window): sit in a wall; pos = distance from the wall's start (x1,y1) to the opening centre. Door 0.9 x 2.1 (entrance 1.0), window 1.2 x 1.4 sill 0.9, bathroom window 0.8 x 0.8 sill 1.4. flip = 1 or -1 chooses the side a door swings to.
- columns: centre x,y, size w x d, height h, round true/false.
- slabs: rectangle x,y (top-left), w,h, thickness t; the top of a slab is at its story's elevation. Every story above ground needs floor slabs, leaving a hole over stairs.
- roofs: rectangle x,y,w,h (outer size including about 0.5 m overhang), shape gable or flat, pitch in degrees, base = height above its story where the roof starts (usually the wall height), ridge "x" or "y".
- generate_layout {bedrooms, baths, area, plot_w?, plot_d?, option 1-3}: builds a whole floor plan option (walls, doors, windows, rooms) next to what is drawn. Use it when asked to design or lay out a house or flat from a brief.
- curve_wall {id, bulge}: bends a wall into an arc, bulge in metres at its middle (+ left).
- add_ramp (rectangle, dir, rise), add_shaft (rectangle, thru true/false), add_dormer (rectangle on a roof, face n/e/s/w, dh), add_morph (rectangle or pts, mh height, elev), add_callout (rectangle, scale 5/10/20/50), add_pipe (x1,y1,x2,y2, sys drain/water/hot/heat/gas/duct/vent, d, z, fall %), add_footing (x1..y2, w, d, top), add_contour (x1..y2, z).
- stairs: rectangle x,y,w,h, dir = n/e/s/w is the direction you walk up. Optional shape "L" (quarter landing) or "U" (half landing) with turn "l"/"r" and flight width fw (default 1.0); an L or U stair needs a rectangle at least about 2.2 m on both sides. A stair rises to the next story; about 0.28 m of run per riser, so a 3.0 m story needs about 4.2 m of run (allow 3.5 m minimum), width 0.9-1.2.
- zones (rooms): rectangle x,y,w,h on the inside faces of walls, name, area = w*h. Rooms should have sensible sizes (bedroom 10-16 m2, bath 4-7, living 18-35) and each needs a door.
- dims: dimension line from (x1,y1) to (x2,y2) with offset off.
- rails (guard railings, height h) and beams (width w, depth h, top = height of the beam's top above its story) are lines from (x1,y1) to (x2,y2). Put a 1.0 m rail along every open edge of a stair void or balcony.
- labels: text notes; (x1,y1) is the point the leader points at, (x2,y2) where the text sits (same point = no leader).
- millwork is furniture of type base (base cabinet 0.6 deep, 0.9 high, worktop), tall (2.2 high) or upper (wall cabinet 0.35 deep, elev 1.45 above the floor), with doors (count) and plinth. Any object can have elev = height above its floor.
- walls can have fin (render, brick, timber, concrete, stone, tile: the 3D finish); zones can have floor (timber, tile, concrete, stone, carpet) and fin (a text such as "Walls: paint, white").
- polygons: zones, slabs, roofs and the site may instead give "pts": [[x,y],[x,y],...] (3 or more corners, in order); x,y,w,h are then ignored. A polygon roof is flat.
- roofs: shape gable, hip, shed or flat. A shed roof rises toward "up" = n/e/s/w.
- wall types (layered walls with a U-value): give a wall "wt" with one of the wall type ids listed in the model (wall_types). Its thickness then follows the type.
- renovation: any wall, opening, column, beam, slab, roof, stair, rail, object or fixture can have "reno": "exist" (existing, kept) or "demo" (to be demolished); omit it for new work.
- door "style": single, double, sliding, pocket, opening. Window "style": casement, tilt, sliding, fixed.
- zones can have ceil (ceiling height above the floor) and ceilT (plaster, gypsum, acoustic, timber, exposed).
- fixtures: point x,y with type downlight, spot, pendant, linear, fan, smoke, speaker, ac (on the ceiling plan) or socket, socket2, switch, switch2, data (on walls, height z, rot like furniture: put them just off a wall face, back to the wall).
- skylights: rectangle x,y,w,h inside a roof of the same story.
- grid lines: structural grid from (x1,y1) to (x2,y2) with a name (1, 2, 3 for vertical lines, A, B, C for horizontal); they show on every story.

promptEl.addEventListener('input', () => { promptEl.style.height = 'auto'; promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px'; });
promptEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('#compose').addEventListener('submit', e => { e.preventDefault(); if (chatBusy) { chatCtl && chatCtl.abort(); } else send(); });
const ERR_COPY = {
  not_granted: 'The assistant needs your permission to use Claude. Reopen the page to be asked again.',
  sampling_disabled: 'Claude is not available for this account.',
  rate_limited: 'Too many requests right now. Wait a moment, then send again.',
  session_expired: 'Your Claude session expired. Sign in again, then retry.',
  refused: 'Claude declined that request. Try wording it differently.',
  invalid_json: 'The answer came back in a form the app could not read. Send the request again.',
  prompt_too_large: 'The model and conversation are too long. Clear the conversation and try again.'
};
async function send() {
  const text = promptEl.value.trim();
  if (!text || chatBusy || !sampleFn) return;
  promptEl.value = ''; promptEl.style.height = 'auto';
  chatLog.push({ role: 'user', text }); renderChat();
  const wait = document.createElement('div'); wait.className = 'msg ai wait'; wait.textContent = 'Reading your model…'; msgs.append(wait); msgs.scrollTop = msgs.scrollHeight;
  chatBusy = true; chatCtl = new AbortController(); setChatState();
  const history = chatLog.slice(0, -1).slice(-8).map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
  if (history[0] && history[0].role === 'assistant') history.shift();
  const turns = [{ role: 'user', content: RULES }, ...history, { role: 'user', content: 'Current model (JSON):\n' + modelForAI() + '\n\nRequest: ' + text }];
  try {
    let shown = false;
    const res = await sampleFn.json(turns, { cache: false, signal: chatCtl.signal, onText: () => { if (!shown) { shown = true; wait.textContent = 'Drawing…'; } } });
    const reply = res && typeof res.reply === 'string' ? res.reply : 'Done.';
    const before = snapshot(), prevStory = curStory;
    const { n, errs } = applyActions(res && res.actions);
    const entry = { role: 'ai', text: reply };
    if (n) {
      pushUndo(before); entry.before = before;
      entry.note = `${n} change${n > 1 ? 's' : ''} applied` + (errs.length ? ` · ${errs.length} skipped` : '');
      changed(); fitView(); if (renderer) frame3(); if (prevStory !== curStory) goStory(curStory);
    } else if (errs.length) entry.note = `${errs.length} change${errs.length > 1 ? 's' : ''} could not be applied`;
    else if (prevStory !== curStory) goStory(curStory);
    chatLog.push(entry);
  } catch (e) {
    if (e && e.code !== 'cancelled') chatLog.push({ role: 'ai', text: ERR_COPY[e && e.code] || 'Something went wrong reaching Claude. Send the request again.' });
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) sampleFn = null;
  } finally { chatBusy = false; chatCtl = null; saveChat(); renderChat(); setChatState(); }
}
(window.claude && window.claude.use ? window.claude.use('sample') : Promise.resolve(null))
  .then(s => { sampleFn = s || null; }, () => { sampleFn = null; })
  .then(() => { if (!$('#chat').hidden) { renderChat(); setChatState(); } });

/* ================= init ================= */
const inClaude = !!(window.claude && window.claude.use);
$('#askBtn').hidden = !inClaude;
if (inClaude && matchMedia('(min-width:900px)').matches) { $('#chat').hidden = false; $('#askBtn').hidden = true; renderChat(); setChatState(); }
updUndo(); setTool('select'); renderChrome(); resizeAll();
})();
</script>

<div id="installTip" hidden style="position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font:14px/1.4 var(--f-sans);box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center">
  <img src="icon-192.png" alt="" width="40" height="40" style="border-radius:9px;flex:none">
  <div style="flex:1;min-width:0" id="installText"></div>
  <button id="installGo" hidden style="background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-weight:600">Install</button>
  <button id="installX" aria-label="Close" style="color:inherit;font-size:22px;line-height:1;padding:4px 6px">&times;</button>
</div>
<script>
(() => {
  const tip = document.getElementById('installTip'), txt = document.getElementById('installText'), go = document.getElementById('installGo');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let seen = false; try { seen = localStorage.getItem('pocketbim.installTip') === '1'; } catch (e) {}
  const close = () => { tip.hidden = true; try { localStorage.setItem('pocketbim.installTip', '1'); } catch (e) {} };
  document.getElementById('installX').onclick = close;
  if (standalone || seen) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    txt.innerHTML = '<b>Install Pocket BIM</b><br>Tap <b>Share</b> <span aria-hidden="true">&#x2B06;&#xFE0E;</span> below, then <b>Add to Home Screen</b>. It then works offline.';
    setTimeout(() => tip.hidden = false, 1500);
  }
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    txt.innerHTML = '<b>Install Pocket BIM</b><br>Add it to your home screen. It works offline.';
    go.hidden = false; tip.hidden = false;
  });
  go.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice.catch(() => {}); deferred = null; close(); };
  window.addEventListener('appinstalled', close);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            const t = document.getElementById('toast');
            if (t) { t.textContent = 'Update ready. Reopen the app to use it'; t.hidden = false; setTimeout(() => t.hidden = true, 4000); }
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
